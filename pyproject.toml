[project]
name = "kanakko"
version = "0.1.0"
description = "Natural-language expense tracking over Telegram"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "psycopg[binary]>=3.2",
    "python-telegram-bot>=21.10",
    "pydantic>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kanakko"]
