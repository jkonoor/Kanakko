# The whole stack: web, db, and the cron sidecar (DECISIONS §8).
#
# Locally: `docker compose up --build` with the keys from .env.example set.
# On Dokploy this file is pasted in as a raw compose file and the environment
# comes from `compose.saveEnvironment` — no secret ever lives in here, and the
# `:?` defaults make a missing one fail at `up` rather than at the first query.

x-app-env: &app-env
  # POSTGRES_PASSWORD is interpolated here unencoded, so it must be URL-safe:
  # [A-Za-z0-9._~-] only. An `@` in it makes the host `<rest>@db` and web dies
  # in the migrator naming DNS while db sits there healthy.
  DATABASE_URL: "postgresql://${POSTGRES_USER:?see .env.example}:${POSTGRES_PASSWORD:?see .env.example}@db:5432/${POSTGRES_DB:?see .env.example}"
  # web reads the bot token for the webhook and initData HMAC (DECISIONS §13)
  # and OpenRouter to parse (§2); cron reads the bot token to send summaries.
  # Required, so `:?` stops `up` on a missing one rather than the first webhook
  # or job — an env the operator set on Dokploy but no service asked for is a
  # KeyError phases later, not at deploy.
  TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?see .env.example}"
  # web verifies /webhook origin against this (DECISIONS §15). Required and `:?`:
  # fail-closed lives in the app, but an unset secret should stop `up`, not ship
  # an endpoint that 403s every legitimate Telegram update.
  TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:?see .env.example}"
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?see .env.example}"
  # Optional: §2 defaults to claude-opus-5 when unset, so `:-` not `:?`.
  OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
  # Signup policy (§16): `invite` (closed) or `open`. Default here is `invite`,
  # but the code fails closed regardless, so a typo like `Open` also stays shut.
  SIGNUP_MODE: "${SIGNUP_MODE:-invite}"
  # Who may issue signup invites (§16) — comma-separated Telegram user ids. Not a
  # database role on purpose: `/invite_signup` hands out the bot itself, so only
  # whoever deploys can grant it. Empty admits nobody, which is the safe default.
  ADMIN_TELEGRAM_IDS: "${ADMIN_TELEGRAM_IDS:-}"
  # Per-user daily message cap (§16, cost control). Default here is 50; code
  # falls back to 50 too for an unset or non-integer value, so `:-` empty is safe.
  DAILY_MESSAGE_CAP: "${DAILY_MESSAGE_CAP:-50}"
  # Logging, audit trail, trace mode (§17). LOG_DIR unset disables both sinks
  # (that keeps pytest from writing into the repo), so the default is set *here*,
  # not in code — otherwise a prod deploy that forgot it logs nothing. It is the
  # mount point of the shared volume the [human] task adds to web and cron. The
  # code reads all three with `or`, so `:-` leaving them present-but-empty is safe.
  LOG_DIR: "${LOG_DIR:-/app/logs}"
  TRACE_MODE: "${TRACE_MODE:-on}"
  TRACE_KEEP: "${TRACE_KEEP:-}"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?see .env.example}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?see .env.example}"
      POSTGRES_DB: "${POSTGRES_DB:?see .env.example}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # web migrates on start, so "container exists" is not good enough.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    # No command: the Dockerfile's CMD is the one definition of how web starts,
    # so compose and the deployed Application cannot drift apart.
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    # Loopback only. Traefik reaches the container over the docker network, so
    # the published port is for local use — and this file is what gets pasted
    # into Dokploy, on a host that is not ours alone. A 0.0.0.0 binding would
    # put /telegram/webhook on plaintext :8000 for anyone (DECISIONS §14).
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  cron:
    build: .
    # Not `cron -f` directly: cron runs jobs with a stripped environment, so the
    # entrypoint first dumps the container env to /app/cron.env (which each
    # crontab line sources) and then execs `cron -f`. Two tokens, so Dokploy's
    # whitespace-split command field carries it intact. See cron/entrypoint.sh.
    command: sh /app/cron/entrypoint.sh
    environment:
      <<: *app-env
      # Not cosmetic: the crontab's wall-clock times are IST (DECISIONS §10,
      # PLAN Phase 3). Without this the 21:00 summary fires at 02:30 IST and
      # nothing errors. The three entries themselves land with Phase 3.
      TZ: Asia/Kolkata
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
